<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h2>Mon espace</h2>

    <div id="infos"></div>

    <div class="nav">
      <a href="commandes.html">Passer une commande</a>
      <a href="index.html">Déconnexion</a>
    </div>
  </div>

  <script>
    // Récupération des infos stockées après login
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
      window.location.href = "login.html";
    }

    document.getElementById("infos").innerHTML = `
      <p><strong>Nom :</strong> ${user.nom}</p>
      <p><strong>Email :</strong> ${user.email}</p>
      <p><strong>Téléphone :</strong> ${user.telephone}</p>
      <p><strong>Solde carte :</strong> ${user.solde_carte} CHF</p>
      <p><strong>Consignes :</strong> ${user.consignes}</p>
      <p><strong>Nombre de commandes :</strong> ${user.nb_commandes}</p>
      <p><strong>Statut :</strong> ${user.statut}</p>
    `;
  </script>
</body>
</html>
