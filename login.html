<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
    .error {
      background: #ffdddd;
      color: #a10000;
    }
    .success {
      background: #ddffdd;
      color: #006600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Connexion</h2>

    <input type="email" id="email" placeholder="Votre email" required>

    <button onclick="envoyer()">Se connecter</button>

    <div id="msg" class="message"></div>
  </div>

  <script>
    function afficherMessage(type, texte) {
      const msg = document.getElementById("msg");
      msg.className = "message " + type;
      msg.innerText = texte;
      msg.style.display = "block";
    }

    function envoyer() {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        afficherMessage("error", "Veuillez entrer votre email");
        return;
      }

      const data = {
        action: "login",
        email: email
      };

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) {
            afficherMessage("error", res.message);
          } else {
            afficherMessage("success", "Connexion réussie !");
            // Redirection possible :
            // window.location.href = "dashboard.html";
          }
        })
        .withFailureHandler(function (err) {
          afficherMessage("error", "Erreur serveur : " + err);
        })
        .doPost({ data: JSON.stringify(data) });
    }
  </script>
</body>
</html>
