<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Commander</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h2>Passer une commande</h2>

    <input type="text" id="plat" placeholder="Nom du plat" required>
    <input type="number" id="quantite" placeholder="Quantité" min="1" required>

    <select id="sansriz">
      <option value="non">Avec riz</option>
      <option value="oui">Sans riz</option>
    </select>

    <select id="family">
      <option value="non">Portion normale</option>
      <option value="oui">Portion Family</option>
    </select>

    <select id="paiement">
      <option value="cash">Cash</option>
      <option value="twint">Twint</option>
      <option value="carte">Carte prépayée</option>
    </select>

    <button onclick="envoyer()">Commander</button>

    <div id="msg" class="message"></div>

    <div class="nav">
      <a href="dashboard.html">Retour</a>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
      window.location.href = "login.html";
    }

    function afficherMessage(type, texte) {
      const msg = document.getElementById("msg");
      msg.className = "message " + type;
      msg.innerText = texte;
      msg.style.display = "block";
    }

    function envoyer() {
      const data = {
        action: "commande",
        email: user.email,
        plat: document.getElementById("plat").value.trim(),
        quantite: document.getElementById("quantite").value,
        sansriz: document.getElementById("sansriz").value,
        family: document.getElementById("family").value,
        paiement: document.getElementById("paiement").value
      };

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) {
            afficherMessage("error", res.message);
          } else {
            afficherMessage("success", "Commande enregistrée !");
          }
        })
        .withFailureHandler(function (err) {
          afficherMessage("error", "Erreur serveur : " + err);
        })
        .doPost({ data: JSON.stringify(data) });
    }
  </script>
</body>
</html>
